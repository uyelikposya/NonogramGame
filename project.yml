name: PurrfectNonogram

options:
  bundleIdPrefix: com.example.purrfect   # Uygulama adı kesinleşince değiştir
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  NonogramKit:
    path: Packages/NonogramKit
  # Aşama 4'te:
  # GoogleMobileAds:
  #   url: https://github.com/googleads/swift-package-manager-google-mobile-ads
  #   majorVersion: 11

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""              # Kendi Team ID'n
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  PurrfectNonogram:
    type: application
    platform: iOS
    sources:
      - path: PurrfectNonogram
    dependencies:
      - package: NonogramKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.purrfect.nonogram
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: PurrfectNonogram/Resources/Info.plist
      properties:
        CFBundleDisplayName: Purrfect Nonogram
        CFBundleLocalizations: [en, tr]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]

  PurrfectNonogramTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PurrfectNonogramTests
    dependencies:
      - target: PurrfectNonogram
      - package: NonogramKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.purrfect.nonogram.tests

schemes:
  PurrfectNonogram:
    build:
      targets:
        PurrfectNonogram: all
        PurrfectNonogramTests: [test]
    test:
      targets: [PurrfectNonogramTests]
      gatherCoverageData: true
