name: Catgrid

options:
  bundleIdPrefix: com.catgridcollection   # App Store Connect'te kaydedilen kimlikle aynı olmalı
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  NonogramKit:
    path: Packages/NonogramKit
  # 11.5.0: Xcode 15.2 ile çalışan son sürüm. 11.6.0+ MarketplaceKit kullanır ve Xcode 15.3 ister
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    exactVersion: 11.5.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    majorVersion: 2.1.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""              # Kendi Team ID'n
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Catgrid:
    type: application
    platform: iOS
    sources:
      - path: Catgrid
        excludes:
          - Resources/Catgrid.storekit   # yalnızca Xcode'da yerel satın alma testi için
          - Resources/PrivacyInfo.xcprivacy
      # Apple'ın zorunlu gizlilik bildirimi; kaynak olarak pakete girmeli
      - path: Catgrid/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: NonogramKit
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catgridcollection.nonogram
        OTHER_LDFLAGS: $(inherited) -ObjC   # Google Mobile Ads SDK gereği
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Catgrid/Resources/Info.plist
      properties:
        CFBundleDisplayName: Catgrid
        CFBundleLocalizations: [en, tr]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Google'ın test uygulama kimliği; AdMob onayından sonra kendi kimliğinle değiştir
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        NSUserTrackingUsageDescription: Your data will be used to show you more relevant ads. This keeps Catgrid free.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork

  CatgridTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CatgridTests
    dependencies:
      - target: Catgrid
      - package: NonogramKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.catgridcollection.nonogram.tests

  CatgridUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CatgridUITests
    dependencies:
      - target: Catgrid
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.catgridcollection.nonogram.uitests
        TEST_TARGET_NAME: Catgrid

schemes:
  Catgrid:
    run:
      # App Store Connect'te ürün tanımlanmadan simülatörde satın almayı denemek için
      storeKitConfiguration: Catgrid/Resources/Catgrid.storekit
    build:
      targets:
        Catgrid: all
        CatgridTests: [test]
        CatgridUITests: [test]
    test:
      targets: [CatgridTests, CatgridUITests]
      gatherCoverageData: true
