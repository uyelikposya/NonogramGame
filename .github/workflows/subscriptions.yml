name: Abonelik metinlerini yükle

# Elle başlatılır: GitHub → Actions → "Abonelik metinlerini yükle" → Run workflow.
# Premium grubunun ve iki aboneliğin 8 dildeki ad/açıklamalarını App Store Connect'e yazar.
on:
  workflow_dispatch:

jobs:
  subscriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - run: python3 Tools/asc_subscriptions.py
